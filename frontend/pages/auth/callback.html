<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Completing Sign In | XDevs Programming</title>
  <link rel="icon" href="../../assets/favicon.svg">
  <link rel="stylesheet" href="../../css/auth.css">
</head>

<body>
  <main class="auth-shell">
    <section class="auth-card status-card" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <h1 id="status-title">Completing sign in</h1>
      <p id="status-message">Securely verifying your account…</p>
    </section>
  </main>

  <script src="../../js/config.js"></script>
  <script src="../../js/wake-manager.js"></script>
  <script src="../../js/auth.js"></script>
  <script>
    (async () => {
      const title = document.getElementById("status-title");
      const message = document.getElementById("status-message");
      const params = new URLSearchParams(window.location.hash.slice(1));
      const token = params.get("token");
      const error = params.get("error");

      history.replaceState({}, "", window.location.pathname);

      if (error || !token) {
        title.textContent = "Sign in failed";
        message.textContent = error || "No valid token was received.";

        setTimeout(() => {
          window.location.replace(
            `${APP_CONFIG.LOGIN_PAGE}?error=${encodeURIComponent(message.textContent)}`
          );
        }, 1200);

        return;
      }

      try {
        XDevsAuth.setToken(token);
        const user = await XDevsAuth.currentUser();
        window.location.replace(XDevsAuth.dashboardFor(user));
      } catch {
        XDevsAuth.clearAuth();
        title.textContent = "Sign in failed";
        message.textContent = "Your account could not be loaded.";

        setTimeout(() => {
          window.location.replace(APP_CONFIG.LOGIN_PAGE);
        }, 1200);
      }
    })();
  </script>
</body>
</html>
