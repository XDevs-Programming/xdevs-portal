<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to the XDevs Programming portal.">
  <title>Sign In | XDevs Programming</title>
  <link rel="icon" href="../../assets/favicon.svg">
  <link rel="stylesheet" href="../../css/auth.css">
</head>

<body>
  <main class="auth-shell">
    <section class="auth-card">
      <a class="brand" href="../../index.html">
        <span class="brand-mark">X</span>
        <span>XDevs Programming</span>
      </a>

      <div class="auth-heading">
        <h1>Sign in to continue</h1>
        <p>
          Use Discord or Google. XDevs never receives your provider password.
        </p>
      </div>

      <div id="login-message" class="message" hidden></div>

      <div class="provider-list">
        <button id="discord-login" class="provider-button discord" type="button">
          Continue with Discord
        </button>

        <button id="google-login" class="provider-button google" type="button">
          Continue with Google
        </button>
      </div>

      <p class="privacy-note">
        Only basic profile information required to create and secure your
        portal account is requested.
      </p>

      <a class="back-link" href="../../index.html">← Return to website</a>
    </section>
  </main>

  <script src="../../js/config.js"></script>
  <script src="../../js/auth.js"></script>
  <script>
    const message = document.getElementById("login-message");
    const params = new URLSearchParams(window.location.search);

    if (params.get("error")) {
      message.textContent = params.get("error");
      message.hidden = false;
      history.replaceState({}, "", window.location.pathname);
    }

    document
      .getElementById("discord-login")
      .addEventListener("click", () => XDevsAuth.loginWith("discord"));

    document
      .getElementById("google-login")
      .addEventListener("click", () => XDevsAuth.loginWith("google"));

    (async () => {
      if (!XDevsAuth.getToken()) return;

      try {
        const user = await XDevsAuth.currentUser();
        window.location.replace(XDevsAuth.dashboardFor(user));
      } catch {
        XDevsAuth.clearAuth();
      }
    })();
  </script>
</body>
</html>
